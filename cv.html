<script>
document.getElementById('year').textContent = new Date().getFullYear();
/* Show the PDF's own Last-Modified date so the page never claims a stale build. */
fetch('cv/cv.pdf', { method: 'HEAD', cache: 'no-cache' })
  .then((r) => {
    const lm = r.headers.get('last-modified');
    document.getElementById('cv-date').textContent = lm
      ? new Date(lm).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })
      : 'unknown';
  })
  .catch(() => { document.getElementById('cv-date').textContent = 'unknown'; });
</script>
