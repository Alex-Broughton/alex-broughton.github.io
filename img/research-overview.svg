<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Research overview: from pixels to cosmological parameters</title>
  <desc id="d">A pipeline from detector physics through calibration and weak lensing to dark energy constraints, with machine learning cutting across all stages.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#1F3A5F" stop-opacity=".10"/>
      <stop offset="1" stop-color="#1F3A5F" stop-opacity=".02"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" fill="#F5F6F8"/>

  <!-- title -->
  <text x="48" y="52" font-family="Newsreader, Georgia, serif" font-size="30" font-weight="500" fill="#16171A">From pixels to cosmological parameters</text>
  <text x="48" y="78" font-size="14" fill="#6F737B">Four threads, one goal: making Rubin/LSST imaging trustworthy at Stage IV dark energy precision</text>

  <!-- stage labels -->
  <g font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#6F737B" text-anchor="middle">
    <text x="174" y="122">RAW EXPOSURE</text>
    <text x="474" y="122">CALIBRATED IMAGE</text>
    <text x="774" y="122">OBJECT MEASUREMENTS</text>
    <text x="1050" y="122">DARK ENERGY</text>
  </g>

  <!-- flow band -->
  <path d="M48 140H1152V372H48Z" fill="url(#flow)"/>

  <!-- ========== card 1: ISR ========== -->
  <g>
    <rect x="48" y="144" width="252" height="224" rx="6" fill="#fff" stroke="#D3D7DD"/>
    <g transform="translate(68 164)" fill="none" stroke="#1F3A5F" stroke-width="1.6">
      <rect x="1" y="1" width="46" height="46" rx="2"/>
      <path d="M16.3 1v46M31.7 1v46M1 16.3h46M1 31.7h46"/>
      <circle cx="24" cy="24" r="4.5" fill="#1F3A5F" stroke="none" opacity=".85"/>
      <circle cx="24" cy="24" r="7.5" opacity=".45"/>
    </g>
    <text x="130" y="184" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="600" fill="#16171A">Instrument Signature</text>
    <text x="130" y="205" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="600" fill="#16171A">Removal</text>
    <line x1="68" y1="226" x2="280" y2="226" stroke="#E0E3E8"/>
    <g font-size="13" fill="#44464C">
      <text x="68" y="249"><tspan fill="#1F3A5F" font-weight="600">Brighter-fatter effect</tspan></text>
      <text x="68" y="271">Bias · dark · crosstalk</text>
      <text x="68" y="293">Nonlinearity · CTI</text>
      <text x="68" y="315">Persistence · stray light</text>
    </g>
    <text x="68" y="348" font-size="12" fill="#6F737B" font-style="italic">LSST pipeline lead</text>
  </g>

  <!-- arrow 1 -->
  <path d="M304 256H340" stroke="#1F3A5F" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ========== card 2: Calibration ========== -->
  <g>
    <rect x="348" y="144" width="252" height="224" rx="6" fill="#fff" stroke="#D3D7DD"/>
    <g transform="translate(368 168)" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linecap="round">
      <path d="M1 36h46"/>
      <path d="M7 36v-6M14 36v-9M21 36v-4M28 36v-11M35 36v-7"/>
      <path d="M3 18c5-8 9-8 14 0s9 8 14 0" opacity=".75"/>
      <circle cx="40" cy="8" r="3.5"/>
    </g>
    <text x="430" y="184" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="600" fill="#16171A">Calibration &amp;</text>
    <text x="430" y="205" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="600" fill="#16171A">Verification</text>
    <line x1="368" y1="226" x2="580" y2="226" stroke="#E0E3E8"/>
    <g font-size="13" fill="#44464C">
      <text x="368" y="249"><tspan fill="#1F3A5F" font-weight="600">LSSTCam calibration products</tspan></text>
      <text x="368" y="271">Release-gating metrics</text>
      <text x="368" y="293">ComCam on-sky plan (TAXICAB)</text>
      <text x="368" y="315">SLAC electro-optical testing</text>
    </g>
    <text x="368" y="348" font-size="12" fill="#6F737B" font-style="italic">proves the corrections work</text>
  </g>

  <!-- arrow 2 -->
  <path d="M604 256H640" stroke="#1F3A5F" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ========== card 3: Weak lensing ========== -->
  <g>
    <rect x="648" y="144" width="252" height="224" rx="6" fill="#fff" stroke="#D3D7DD"/>
    <g transform="translate(668 164)" fill="none" stroke="#1F3A5F" stroke-width="1.6">
      <circle cx="24" cy="24" r="4.5" fill="#1F3A5F" stroke="none" opacity=".85"/>
      <ellipse cx="24" cy="10" rx="5.5" ry="2.6"/>
      <ellipse cx="24" cy="38" rx="5.5" ry="2.6"/>
      <ellipse cx="10" cy="24" rx="2.6" ry="5.5"/>
      <ellipse cx="38" cy="24" rx="2.6" ry="5.5"/>
      <ellipse cx="13" cy="13" rx="5.2" ry="2.5" transform="rotate(-45 13 13)"/>
      <ellipse cx="35" cy="35" rx="5.2" ry="2.5" transform="rotate(-45 35 35)"/>
    </g>
    <text x="730" y="184" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="600" fill="#16171A">Weak Lensing</text>
    <text x="730" y="205" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="600" fill="#16171A">&amp; Clusters</text>
    <line x1="668" y1="226" x2="880" y2="226" stroke="#E0E3E8"/>
    <g font-size="13" fill="#44464C">
      <text x="668" y="249"><tspan fill="#1F3A5F" font-weight="600">Pixel-to-Object models</tspan></text>
      <text x="668" y="271">Metadetection shear maps</text>
      <text x="668" y="293">PSF · rho statistics · photo-z</text>
      <text x="668" y="315">Cluster cosmology (DESC)</text>
    </g>
    <text x="668" y="348" font-size="12" fill="#6F737B" font-style="italic">artifact → shear bias</text>
  </g>

  <!-- arrow 3 -->
  <path d="M904 256H940" stroke="#1F3A5F" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ========== endpoint: cosmology ========== -->
  <g>
    <rect x="948" y="144" width="204" height="224" rx="6" fill="#1F3A5F"/>
    <!-- w0-wa style ellipse -->
    <g transform="translate(1050 222) rotate(-32)" fill="none" stroke="#fff">
      <ellipse rx="62" ry="22" stroke-width="1.6" opacity=".95" fill="#fff" fill-opacity=".10"/>
      <ellipse rx="38" ry="13.5" stroke-width="1.6" opacity=".95" fill="#fff" fill-opacity=".14"/>
    </g>
    <circle cx="1050" cy="222" r="3" fill="#fff"/>
    <text x="1050" y="296" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="600" fill="#fff">Cosmological</text>
    <text x="1050" y="318" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="600" fill="#fff">Parameters</text>
    <text x="1050" y="346" text-anchor="middle" font-size="12" fill="#C9D4E3" font-style="italic">Rubin LSST · DESC</text>
  </g>

  <!-- feedback loop: verification informs ISR -->
  <path d="M474 372v22q0 10-10 10H184q-10 0-10-10v-22" fill="none" stroke="#375C86" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <rect x="224" y="388" width="200" height="20" fill="#F5F6F8"/><text x="324" y="402" text-anchor="middle" font-size="11.5" fill="#375C86">verification residuals refine corrections</text>

  <!-- ========== ML cross-cutting band ========== -->
  <g>
    <rect x="48" y="428" width="1104" height="96" rx="6" fill="#fff" stroke="#375C86" stroke-width="1.4"/>
    <g transform="translate(70 452)" fill="none" stroke="#1F3A5F" stroke-width="1.5">
      <path d="M8 9L26 4M8 9L26 24M8 41L26 24M8 41L26 46M26 4l14 20M26 24h14M26 46l14-22" opacity=".55"/>
      <circle cx="7" cy="9" r="3.4" fill="#1F3A5F" stroke="none"/>
      <circle cx="7" cy="41" r="3.4" fill="#1F3A5F" stroke="none"/>
      <circle cx="27" cy="4" r="3"/>
      <circle cx="27" cy="24" r="3"/>
      <circle cx="27" cy="46" r="3"/>
      <circle cx="41" cy="24" r="3.4" fill="#1F3A5F" stroke="none"/>
    </g>
    <text x="132" y="472" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="600" fill="#16171A">Machine Learning for Survey Data</text>
    <text x="132" y="494" font-size="12.5" fill="#6F737B">cuts across every stage of the pipeline</text>

    <g font-size="12" fill="#44464C">
      <line x1="600" y1="446" x2="600" y2="506" stroke="#E0E3E8"/>
      <text x="624" y="466"><tspan fill="#1F3A5F" font-weight="600">Stray-light</tspan> classifiers</text>
      <text x="624" y="488">in survey visits</text>
      <text x="624" y="506" font-size="11" fill="#6F737B">→ raw exposure</text>

      <text x="790" y="466"><tspan fill="#1F3A5F" font-weight="600">Star–galaxy</tspan> classification</text>
      <text x="790" y="488">multi-method, Rubin DP2</text>
      <text x="790" y="506" font-size="11" fill="#6F737B">→ object measurements</text>

      <text x="966" y="466"><tspan fill="#1F3A5F" font-weight="600">γ-ray emission</tspan> models</text>
      <text x="966" y="488">Fermi-LAT Galactic Center</text>
      <text x="966" y="506" font-size="11" fill="#6F737B">→ thesis work</text>
    </g>
  </g>

  <!-- ticks linking ML band to pipeline -->
  <g stroke="#375C86" stroke-width="1.2" stroke-dasharray="2 3" opacity=".7">
    <path d="M174 404V428"/>
    <path d="M774 372V428"/>
    <path d="M1050 372V428"/>
  </g>
</svg>
